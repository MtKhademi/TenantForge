name: TenantForge CI and deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ['release-*']

permissions:
  contents: read

concurrency:
  group: tenantforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test TenantForge.sln -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t tenantforge-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t tenantforge-web:ci .

  deploy:
    if: startsWith(github.ref, 'refs/tags/release-')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^release-[A-Za-z0-9][A-Za-z0-9_.-]{0,118}$ ]] || {
            echo 'Release tag must be a Docker-compatible release-* tag'; exit 1;
          }
      - name: Build versioned Docker images
        run: |
          docker build -f deploy/Dockerfile.api -t "tenantforge-api:${GITHUB_REF_NAME}" .
          docker build -f deploy/Dockerfile.web -t "tenantforge-web:${GITHUB_REF_NAME}" .
      - name: Transfer images and deploy
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENANTFORGE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.TENANTFORGE_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'Missing TENANTFORGE_SSH_PRIVATE_KEY'; exit 1; }
          test -n "$SSH_HOST_KEY" || { echo 'Missing TENANTFORGE_SSH_HOST_KEY'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          SSH_OPTIONS=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/known_hosts")
          TARGET=oracle-deploy@45.82.137.126
          ssh "${SSH_OPTIONS[@]}" "$TARGET" \
            'test -r /opt/tenantforge/tenantforge.env && docker compose version >/dev/null && docker info >/dev/null' || {
              echo 'Server prerequisite missing: readable /opt/tenantforge/tenantforge.env or Docker Compose access'; exit 1;
            }
          scp "${SSH_OPTIONS[@]}" deploy/compose.yml "$TARGET:/opt/tenantforge/compose.yml"
          docker save "tenantforge-api:${GITHUB_REF_NAME}" "tenantforge-web:${GITHUB_REF_NAME}" | gzip -1 | \
            ssh "${SSH_OPTIONS[@]}" "$TARGET" 'gzip -dc | docker load'
          ssh "${SSH_OPTIONS[@]}" "$TARGET" \
            "cd /opt/tenantforge && TENANTFORGE_IMAGE_TAG=${GITHUB_REF_NAME} docker compose --env-file tenantforge.env -f compose.yml config --quiet && TENANTFORGE_IMAGE_TAG=${GITHUB_REF_NAME} docker compose --env-file tenantforge.env -f compose.yml up -d --wait --wait-timeout 180"
